<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f9f5fc">
  <meta name="description" content="ATHAR أثر | تفاصيل صغيرة، تترك أثر كبير.">
  <title>ATHAR | أثر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #72518d;
      --deep-purple: #382442;
      --lavender: #e8dcef;
      --ivory: #fcf9f5;
      --text: #45374b;
      --muted: #918397;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse at 10% 10%,
          #eee3f4 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%,
          #f1e8dc 0%, transparent 35%),
        var(--ivory);
      color: var(--text);
      font-family: "Cairo", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
    }

    .ornament {
      width: 42px;
      height: 1px;
      background: #c7aed5;
      margin: 0 auto 25px;
      position: relative;
    }

    .ornament::after {
      content: "✦";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--ivory);
      color: var(--purple);
      padding: 0 10px;
      font-size: 13px;
    }

    .brand {
      direction: ltr;
      font-family: "Playfair Display", serif;
      font-size: clamp(43px, 12vw, 57px);
      font-weight: 500;
      letter-spacing: 7px;
      color: var(--deep-purple);
      line-height: 1.3;
    }

    .arabic-name {
      font-size: 23px;
      font-weight: 600;
      color: var(--purple);
      margin-top: 2px;
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-top: 13px;
      margin-bottom: 36px;
      letter-spacing: 0.2px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .social-button {
      min-height: 59px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid transparent;
      border-radius: 15px;
      text-decoration: none;
      font-family: "Cairo", sans-serif;
      font-size: 15px;
      font-weight: 600;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px #38244215;
    }

    .social-button:focus-visible {
      outline: 3px solid #bca2d0;
      outline-offset: 4px;
    }

    .social-button svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .instagram {
      background: var(--purple);
      color: white;
    }

    .tiktok {
      background: var(--deep-purple);
      color: white;
    }

    .whatsapp {
      background: var(--lavender);
      color: var(--deep-purple);
      border-color: #dfcde9;
    }

    .small-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 34px;
    }

    .footer {
      direction: ltr;
      font-family: "Playfair Display", serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #a08ba9;
      margin-top: 7px;
    }

    @media (max-width: 360px) {
      .tagline {
        margin-bottom: 28px;
      }

      .social-button {
        min-height: 55px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .social-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="ornament"></div>

    <header>
      <h1 class="brand">ATHAR</h1>
      <p class="arabic-name">أثــر</p>
      <p class="tagline">كل تفاصيل أثر بمكان واحد</p>
    </header>

    <nav class="buttons" aria-label="روابط أثر">

      <!-- استبدلي الرابط برابط حساب إنستغرام -->
      <a
        class="social-button instagram"
        href="https://www.instagram.com/athar.print22?dlrf=ODNrN2x6eWtxbXl3&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="تابعينا على إنستغرام"
      >
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"
                  stroke="none"/>
        </svg>
        <span>Instagram</span>
      </a>

      <!-- استبدلي الرابط برابط حساب تيك توك -->
      <a
        class="social-button tiktok"
        href="https://www.tiktok.com/@athar0print22?is_from_webapp=1&sender_device=pc"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="تابعينا على تيك توك"
      >
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v11.5a4.5 4.5 0 1 1-4-4.47"/>
          <path d="M14 3c.5 3 2.5 5 5.5 5.5"/>
        </svg>
        <span>TikTok</span>
      </a>

      <!-- ضعي رقم واتساب مع مفتاح الدولة بدون + أو مسافات -->
      <a
        class="social-button whatsapp"
        href="https://wa.me/972566074321"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="تواصلي معنا عبر واتساب"
      >
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.6a8.5 8.5 0 1 1 16.3-3.9Z"/>
          <path d="M8.5 8.2c.5 2.7 2.2 4.6 4.9 5.4"/>
        </svg>
        <span>تواصلي معنا عبر واتساب</span>
      </a>

    </nav>

    <p class="small-note">تفاصيل صغيرة، تترك أثر كبير 🤍</p>
    <footer class="footer">ATHAR · MADE WITH LOVE</footer>

  </main>
</body>
</html>
